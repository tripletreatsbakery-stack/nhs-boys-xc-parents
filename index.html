<!DOCTYPE html>
<html>
<head>
    <title>Noblesville Boys XC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="styles.css">

    <!-- config FIRST -->
    <script src="config.js"></script>
</head>
<body>

<header>
    <h1>Noblesville Boys Cross Country</h1>
</header>

<main>
    <section class="athlete-switcher" aria-labelledby="athleteSwitcherLabel">
        <div>
            <label id="athleteSwitcherLabel" for="athleteDropdown">Change athlete</label>
            <div class="athlete-switcher-help">Your last opened athlete will open automatically on this device.</div>
        </div>
        <select id="athleteDropdown" aria-label="Change athlete"></select>
    </section>

    <div id="status"></div>
    <div id="athleteData"></div>

    <section class="card runner-resources" aria-labelledby="runnerResourcesTitle">
        <h3 id="runnerResourcesTitle">RUNNER RESOURCES</h3>
        <a
            class="resource-link"
            href="https://drive.google.com/file/d/1cvPvW3oh9TGcm0XtU0oAe7xHhRwWEh7v/view"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="resource-copy">
                <span class="resource-title">Mobility &amp; Exercise Library</span>
                <span class="resource-description">Videos and guidance for mobility, stretching, and recovery</span>
            </span>
            <span class="resource-action" aria-hidden="true">Open library</span>
        </a>
    </section>
</main>

<!-- app LAST -->
<script src="app.js"></script>

</body>
</html>
